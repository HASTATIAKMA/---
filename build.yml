name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "요척_누락방지_프로그램" "요척_누락방지_프로그램.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 요척_누락방지_프로그램-Windows
          path: dist/요척_누락방지_프로그램.exe
